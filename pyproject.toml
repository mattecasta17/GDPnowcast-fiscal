[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gdpnowcast-fiscal"
version = "0.2.0.dev0"
description = "Mixed-frequency dynamic factor model nowcasting U.S. real GDP, with a fiscal-variable extension."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Matteo Castaldo" }]
keywords = ["nowcasting", "dynamic factor model", "macroeconomics", "GDP", "FRED"]

# Core runtime deps. Phase 2 wires fetch; Phase 3 wires DFM. Pin compatible ranges.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<0.16",
    "openpyxl>=3.1,<4",
    "fredapi>=0.5,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.36,<2",
    "plotly>=5.22,<6",
    "matplotlib>=3.9,<4",
]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pre-commit>=3.7,<5",
]

[project.scripts]
gdpnowcast = "gdpnowcast.cli:app"

[project.urls]
Repository = "https://github.com/mattecasta17/GDPnowcast-fiscal"

[tool.hatch.build.targets.wheel]
packages = ["src/gdpnowcast"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "configs/", "apps/", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
# This repo lives under OneDrive, whose cloud-files filter blocks hardlinks
# (os error 396). Force copy mode so `uv sync` / `uv pip install` work here.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py313"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Estimator math modules use econometric matrix notation: uppercase X (data
# matrix), T/N (dimensions), x_MA (moving average), block matrices, etc.
# Allow non-lowercase argument/variable names here rather than rewriting the
# verbatim ports of the v1 DFM math (which would obscure the golden-parity
# review and risk transcription errors). Extended by dfm.py / news.py in B4/B5.
"src/gdpnowcast/_dfm_support.py" = ["N803", "N806"]
# dfm.py also keeps v1 PascalCase function names (InitCond/EMstep/SKF/FIS/...).
"src/gdpnowcast/dfm.py" = ["N802", "N803", "N806"]
# news.py keeps v1 names (News_DFM) + matrix notation (X_old/Res/Plag/WW/...).
"src/gdpnowcast/news.py" = ["N802", "N803", "N806"]

[tool.ruff.lint.flake8-bugbear]
# Typer's dependency-injection defaults (typer.Option/Argument) are the idiomatic
# pattern; they are not the mutable-default footgun B008 targets.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "golden: regression tests against committed DFM output snapshots",
    "slow: tests that take more than 5 seconds",
]

[tool.coverage.run]
branch = true
source = ["src/gdpnowcast"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
