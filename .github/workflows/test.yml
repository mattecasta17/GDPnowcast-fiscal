name: test

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"  # match the local uv that generated uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/gdpnowcast/ tests/

      - name: Tests (pytest, offline lane — slow/network tests excluded)
        run: uv run pytest -m "not slow" -v --cov=gdpnowcast --cov-fail-under=0
